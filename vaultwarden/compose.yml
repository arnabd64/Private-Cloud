networks:
  public:
    external: true

volumes:
  data:

services:
  vault:
    image: ghcr.io/dani-garcia/vaultwarden:1.37.2-alpine
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - public
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - data:/data
    environment:
      # Security & IP Handling
      - IP_HEADER=Cf-Connecting-IP
      - DISABLE_ADMIN_TOKEN=true
      - ENABLE_DB_WAL=true

      # Optimizations
      - WEBSOCKET_ENABLED=true
      - ICON_REDIRECT=true

      # Account Settings
      - DOMAIN=${DOMAIN}
      - SIGNUPS_ALLOWED=false
      - LOG_LEVEL=warn
      - SHOW_PASSWORD_HINT=false
      
      # SSO
      - SSO_ENABLED=true
      - SSO_ONLY=false
      - SSO_SIGNUPS_MATCH_EMAIL=true
      - SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION=true
      - SSO_SCOPES=email profile groups offline_access
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_AUTHORITY=${SSO_AUTHORITY}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/alive"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      - docker-volume-backup.stop-during-backup=true

  backup:
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    networks:
      - public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - data:/backup:ro
      - ${LOCAL_BACKUP_DESTINATION}:/archive
    environment:
      - TZ=Asia/Kolkata
      - BACKUP_CRON_EXPRESSION=30 23 * * 2
      - BACKUP_RETENTION_DAYS=365
      - BACKUP_FILENAME=vaultwarden-%Y-%m-%dT%H-%M-%S.tar.gz
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
    depends_on:
      vault:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32M
  
